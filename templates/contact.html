{% extends "base.html" %}

{% block content %}

<section class="container py-5 mt-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold text-primary">

            Contact Us

        </h1>

        <p class="lead">

            We'd love to hear from you.

        </p>

    </div>

    <div class="row">

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="text-primary">

                        Contact Information

                    </h3>

                    <hr>

                    <p>

                        <strong>Company</strong><br>

                        Smart Meter Company Limited

                    </p>

                    <p>

                        <strong>Address</strong><br>

                        Kaduna, Nigeria

                    </p>

                    <p>

                        <strong>Email</strong><br>

                        info@smartmeter.com

                    </p>

                    <p>

                        <strong>Phone</strong><br>

                        +234 XXX XXX XXXX

                    </p>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="text-primary">

                        Send Us a Message

                    </h3>

                    <hr>

                    <form>

                        <div class="mb-3">

                            <label class="form-label">

                                Full Name

                            </label>

                            <input type="text"
                                   class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input type="email"
                                   class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Subject

                            </label>

                            <input type="text"
                                   class="form-control">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Message

                            </label>

                            <textarea class="form-control"
                                      rows="5"></textarea>

                        </div>

                        <button class="btn btn-primary w-100">

                            Send Message

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}

{% extends "base.html" %}

{% block title %}Add Category{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Add Complaint Category</h2>

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">

                Category Name

            </label>

            <input
                type="text"
                name="name"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Description

            </label>

            <textarea
                name="description"
                rows="4"
                class="form-control"></textarea>

        </div>

        <button class="btn btn-success">

            Save Category

        </button>

        <a href="{{ url_for('admin.categories') }}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}

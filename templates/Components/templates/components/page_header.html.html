<div class="row mb-4">

    <div class="col-lg-8">

        <h2 class="fw-bold">

            {{ title }}

        </h2>

        <p class="text-muted">

            {{ subtitle }}

        </p>

    </div>

    <div class="col-lg-4 text-end">

        {% if button_text %}

        <a href="{{ button_link }}"

           class="btn btn-primary">

            <i class="bi bi-plus-circle"></i>

            {{ button_text }}

        </a>

        {% endif %}

    </div>

</div>
